name: Nexo Alpha Release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Nexo 0.0.8 validation
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_commit.message, '[release]'))
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run project checks
        run: npm test

      - name: Build client (TypeScript + Vite)
        run: npm run build --prefix client

      - name: Build Windows installer
        run: npm run electron:build

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path ($installer.FullName + '.sha256') -Value $hash -NoNewline -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-${{ steps.version.outputs.version }}-Windows
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nexo ${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.exe.sha256
            dist/latest.yml
            dist/*.blockmap
