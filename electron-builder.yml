appId: com.nexo.app
productName: Nexo
copyright: Copyright © 2026 Nexo

directories:
  output: dist
  buildResources: build

files:
  - "package.json"
  - "server.js"
  - "electron/**/*"
  - "public/**/*"
  - "node_modules/**/*"
  - "!node_modules/**/{test,tests,__tests__,docs,example,examples}/**"

asar: true
asarUnpack:
  - "server.js"
  - "public/**/*"
  - "electron/**/*"
  - "**/node_modules/better-sqlite3/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-Setup.${ext}"
  signAndEditExecutable: false
  icon: "electron/icons/Nexo-Desctop-ico-256.png"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexo

extraMetadata:
  main: electron/main.js

npmRebuild: false
buildDependenciesFromSource: false
