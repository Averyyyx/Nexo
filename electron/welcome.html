<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0D0A1A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        .logo-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }

        .logo {
            width: 100%;
            height: 100%;
            animation: fadeIn 1s ease-out;
        }

        /* Анимация молекул */
        .molecule {
            position: absolute;
            border-radius: 50%;
            animation: orbit 4s linear infinite;
        }

        .molecule-1 {
            width: 16px;
            height: 16px;
            background: #9966F2;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 0s;
            box-shadow: 0 0 20px rgba(153, 102, 242, 0.6);
        }

        .molecule-2 {
            width: 16px;
            height: 16px;
            background: #4099F2;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 1.3s;
            box-shadow: 0 0 20px rgba(64, 153, 242, 0.6);
        }

        .molecule-3 {
            width: 16px;
            height: 16px;
            background: #00E6CC;
            top: 50%;
            left: 15%;
            transform: translateY(-50%);
            animation-delay: 2.6s;
            box-shadow: 0 0 20px rgba(0, 230, 204, 0.6);
        }

        @keyframes orbit {
            0% {
                transform: translateX(-50%) translateY(0) rotate(0deg) translateX(90px) rotate(0deg);
            }
            100% {
                transform: translateX(-50%) translateY(0) rotate(360deg) translateX(90px) rotate(-360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            color: white;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: slideUp 0.8s ease-out 0.3s both;
            background: linear-gradient(135deg, #66FFF2, #33BFE6, #734DE6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: 400;
            animation: slideUp 0.8s ease-out 0.5s both;
        }

        .status-container {
            margin-top: 40px;
            animation: slideUp 0.8s ease-out 0.7s both;
        }

        .status-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #66FFF2;
            border-radius: 50%;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .version {
            position: absolute;
            bottom: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="welcome-logo.svg" alt="Nexo Logo" class="logo">
            <div class="molecule molecule-1"></div>
            <div class="molecule molecule-2"></div>
            <div class="molecule molecule-3"></div>
        </div>
        <h1 class="title">Nexo</h1>
        <p class="subtitle">Связь без границ</p>
        <div class="status-container">
            <p class="status-text" id="statusText">Подключение к серверу...</p>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
    <div class="version" id="versionText">Nexo v1.0.0</div>

    <script>
        const { ipcRenderer } = require('electron');
        
        const statusText = document.getElementById('statusText');
        const versionText = document.getElementById('versionText');

        // Получаем версию приложения
        ipcRenderer.invoke('get-app-version').then(version => {
            versionText.textContent = `Nexo v${version}`;
        });

        // Проверяем статус аутентификации
        async function checkAuthStatus() {
            try {
                const response = await fetch('http://127.0.0.1:4000/api/auth/status');
                const data = await response.json();
                
                if (data.authenticated) {
                    statusText.textContent = 'Добро пожаловать!';
                    setTimeout(() => {
                        // Перенаправляем в чаты
                        window.location.href = 'http://127.0.0.1:4000/chats';
                    }, 1000);
                } else {
                    statusText.textContent = 'Вход в систему...';
                    setTimeout(() => {
                        // Перенаправляем на регистрацию
                        window.location.href = 'http://127.0.0.1:4000';
                    }, 1000);
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                statusText.textContent = 'Ошибка подключения. Повторная попытка...';
                setTimeout(checkAuthStatus, 2000);
            }
        }

        // Начинаем проверку после небольшой задержки
        setTimeout(checkAuthStatus, 1000);
    </script>
</body>
</html>
