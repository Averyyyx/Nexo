<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0D0A1A;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .titlebar {
            background: linear-gradient(135deg, #66FFF2, #33BFE6, #734DE6);
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            -webkit-app-region: drag;
            user-select: none;
            flex-shrink: 0;
        }

        .titlebar-title {
            color: white;
            font-size: 13px;
            font-weight: 500;
            flex: 1;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .titlebar-controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .titlebar-button {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .titlebar-button:hover {
            transform: scale(1.1);
        }

        .titlebar-minimize {
            background: rgba(255, 255, 255, 0.3);
        }

        .titlebar-minimize:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .titlebar-close {
            background: rgba(255, 100, 100, 0.3);
        }

        .titlebar-close:hover {
            background: rgba(255, 100, 100, 0.5);
        }

        .titlebar-button svg {
            width: 8px;
            height: 8px;
            fill: white;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            text-align: center;
        }

        .logo-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }

        .logo {
            width: 100%;
            height: 100%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            color: white;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: slideUp 0.8s ease-out 0.3s both;
            background: linear-gradient(135deg, #66FFF2, #33BFE6, #734DE6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: 400;
            animation: slideUp 0.8s ease-out 0.5s both;
        }

        .status-container {
            margin-top: 40px;
            animation: slideUp 0.8s ease-out 0.7s both;
        }

        .status-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #66FFF2;
            border-radius: 50%;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .version {
            position: absolute;
            bottom: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <div class="titlebar-title">Nexo</div>
        <div class="titlebar-controls">
            <button class="titlebar-button titlebar-minimize" id="minimizeButton" title="Свернуть">
                <svg viewBox="0 0 10 1" xmlns="http://www.w3.org/2000/svg">
                    <rect width="10" height="1" fill="white"/>
                </svg>
            </button>
            <button class="titlebar-button titlebar-close" id="closeButton" title="Закрыть">
                <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1L9 9M9 1L1 9" stroke="white" stroke-width="1.5" fill="none"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="content">
        <div class="container">
        <div class="logo-container">
            <img src="welcome-logo.svg" alt="Nexo Logo" class="logo">
        </div>
        <h1 class="title">Nexo</h1>
        <p class="subtitle">Связь без границ</p>
        <div class="status-container">
            <p class="status-text" id="statusText">Подключение к серверу...</p>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
    </div>
    <div class="version" id="versionText">Nexo v1.0.0</div>

    <script>
        const { ipcRenderer } = require('electron');
        
        document.getElementById('minimizeButton').addEventListener('click', () => {
            ipcRenderer.send('minimize-window');
        });
        
        document.getElementById('closeButton').addEventListener('click', () => {
            ipcRenderer.send('close-window');
        });
        
        const statusText = document.getElementById('statusText');
        const versionText = document.getElementById('versionText');

        // Получаем версию приложения
        ipcRenderer.invoke('get-app-version').then(version => {
            versionText.textContent = `Nexo v${version}`;
        });

        // Проверяем статус аутентификации
        async function checkAuthStatus() {
            let attempts = 0;
            const maxAttempts = 10;
            
            while (attempts < maxAttempts) {
                try {
                    // Используем 127.0.0.1 для стабильности
                    const response = await fetch('http://127.0.0.1:4000/api/auth/status', {
                        mode: 'cors',
                        cache: 'no-cache',
                        timeout: 5000
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.authenticated) {
                        statusText.textContent = 'Добро пожаловать!';
                        setTimeout(() => {
                            // Перенаправляем в чаты
                            window.location.href = 'http://127.0.0.1:4000/chats';
                        }, 1000);
                        return;
                    } else {
                        statusText.textContent = 'Вход в систему...';
                        setTimeout(() => {
                            // Перенаправляем на регистрацию
                            window.location.href = 'http://127.0.0.1:4000';
                        }, 1000);
                        return;
                    }
                } catch (error) {
                    console.error('Auth check failed:', error);
                    attempts++;
                    statusText.textContent = `Подключение к серверу... (${attempts}/${maxAttempts})`;
                    
                    if (attempts < maxAttempts) {
                        await new Promise(resolve => setTimeout(resolve, 2000));
                    }
                }
            }
            
            // Если все попытки неудачны
            statusText.textContent = 'Не удалось подключиться к серверу. Проверьте подключение.';
        }

        // Начинаем проверку после небольшой задержки
        setTimeout(checkAuthStatus, 1000);
    </script>
</body>
</html>
