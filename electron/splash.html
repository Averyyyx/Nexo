<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0D0A1A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            -webkit-app-region: drag; /* Позволяет перетаскивать окно */
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .logo-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .logo {
            width: 100%;
            height: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        /* Анимация вращения молекул по орбитам SVG */
        .logo-svg circle {
            animation: orbit 4s linear infinite;
            transform-origin: center;
        }

        .logo-svg circle:nth-child(7) {
            animation-delay: 0s;
        }

        .logo-svg circle:nth-child(8) {
            animation-delay: 1.3s;
        }

        .logo-svg circle:nth-child(9) {
            animation-delay: 2.6s;
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg) translateX(60px) rotate(0deg);
            }
            100% {
                transform: rotate(360deg) translateX(60px) rotate(-360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-text {
            color: white;
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
            opacity: 0.9;
        }

        .update-text {
            color: #66FFF2;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .update-text.visible {
            opacity: 1;
        }

        .progress-container {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-container.visible {
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #66FFF2, #33BFE6, #734DE6);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .version-text {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="nexo-loading-logo.svg" alt="Nexo Logo" class="logo logo-svg">
        </div>
        <div class="loading-text" id="loadingText">Загрузка...</div>
        <div class="update-text" id="updateText">Обновление до версии 1.0.1</div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>
    <div class="version-text" id="versionText">Nexo v1.0.0</div>

    <script>
        const { ipcRenderer } = require('electron');
        
        const loadingText = document.getElementById('loadingText');
        const updateText = document.getElementById('updateText');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const versionText = document.getElementById('versionText');

        // Обновляем текст загрузки
        ipcRenderer.on('loading-status', (event, status) => {
            loadingText.textContent = status;
        });

        // Показываем обновление
        ipcRenderer.on('update-available', (event, version) => {
            updateText.textContent = `Обновление до версии ${version}`;
            updateText.classList.add('visible');
            progressContainer.classList.add('visible');
        });

        // Обновляем прогресс
        ipcRenderer.on('update-progress', (event, progress) => {
            progressBar.style.width = `${progress}%`;
        });

        // Скрываем обновление
        ipcRenderer.on('update-complete', () => {
            updateText.classList.remove('visible');
            progressContainer.classList.remove('visible');
        });

        // Обновляем версию
        ipcRenderer.on('app-version', (event, version) => {
            versionText.textContent = `Nexo v${version}`;
        });
    </script>
</body>
</html>
